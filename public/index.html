  <!-- Site-wide meta. Per-page title, description, canonical, Open Graph and
       Twitter tags are managed by the <Seo> component (react-helmet-async) so
       each route gets unique values — do NOT hardcode those here, or every page
       would emit a duplicate canonical/OG pointing at the homepage. -->
  <meta name="keywords"
    content="IELTS computer test, ieltscomputertest, ieltscomputertest.com, IELTS practice, IELTS online, IELTS test online, IELTS listening, IELTS reading, IELTS writing, IELTS speaking, IELTS preparation, IELTS mock test" />
  <meta name="author" content="ieltscomputertest.com" />
  <meta name="language" content="English" />

  <!-- Structured Data for SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "ieltscomputertest.com",
      "alternateName": ["IELTS Computer Test", "IELTS Computer-Based Test Practice"],
      "url": "https://ieltscomputertest.com",
      "logo": "https://ieltscomputertest.com/img/logo-ielts.png",
      "description": "Practice IELTS online with a 100% real-exam interface. IELTS Listening, Reading, Writing, Speaking tests.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "VN"
      },
      "sameAs": [
        "https://ieltscomputertest.com"
      ],
      "offers": {
        "@type": "Offer",
        "category": "Education",
        "description": "IELTS Online Training"
      }
    }
    </script>

  <!-- Structured Data: WebSite (site identity for search engines) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ieltscomputertest.com",
      "alternateName": ["IELTS Computer Test", "IELTS Computer-Based Test Practice"],
      "url": "https://ieltscomputertest.com",
      "description": "Practice IELTS online with a 100% real-exam interface. IELTS Listening, Reading, Writing and Speaking tests with up-to-date forecast exams.",
      "inLanguage": "en",
      "publisher": {
        "@type": "EducationalOrganization",
        "name": "ieltscomputertest.com",
        "logo": "https://ieltscomputertest.com/img/logo-ielts.png"
      }
    }
    </script>

  <!-- Apple Touch Icon -->
