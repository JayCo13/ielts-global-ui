<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" sizes="48x48" href="/img/48.png?v=4" />
  <link rel="icon" type="image/png" sizes="192x192" href="/img/192.png?v=4" />
  <link rel="icon" type="image/png" sizes="384x384" href="/img/384.png?v=4" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow" />

  <!-- Site-wide meta. Per-page title, description, canonical, Open Graph and
       Twitter tags are managed by the <Seo> component (react-helmet-async) so
       each route gets unique values — do NOT hardcode those here, or every page
       would emit a duplicate canonical/OG pointing at the homepage. -->
  <meta name="keywords"
    content="EnglishOnComputer, englishoncomputer.com, learn English online, English practice tests, AI English learning, English listening, English reading, English writing, English speaking, computer-based English test practice" />
  <meta name="author" content="EnglishOnComputer" />
  <meta name="language" content="English" />

  <!-- Structured Data for SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "EnglishOnComputer",
      "alternateName": ["EnglishOnComputer.com", "English On Computer"],
      "url": "https://englishoncomputer.com",
      "logo": "https://englishoncomputer.com/img/og-eoc.jpg",
      "description": "An online English learning platform with practical lessons and AI-powered tools to improve listening, speaking, reading and writing.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "VN"
      },
      "sameAs": [
        "https://englishoncomputer.com"
      ],
      "offers": {
        "@type": "Offer",
        "category": "Education",
        "description": "Online English learning"
      }
    }
    </script>

  <!-- Structured Data: WebSite (site identity for search engines) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "EnglishOnComputer",
      "alternateName": ["EnglishOnComputer.com", "English On Computer"],
      "url": "https://englishoncomputer.com",
      "description": "An online English learning platform with practical lessons and AI-powered tools. Practice listening, speaking, reading and writing anytime, anywhere.",
      "inLanguage": "en",
      "publisher": {
        "@type": "EducationalOrganization",
        "name": "EnglishOnComputer",
        "logo": "https://englishoncomputer.com/img/og-eoc.jpg"
      }
    }
    </script>

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/img/192.png?v=4" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Enhanced Title -->
  <title>EnglishOnComputer – Learn English Online with AI-Powered Tools</title>
</head>

<body>
  <noscript>You need to enable JavaScript to use this application.</noscript>
  <div id="root"></div>
  <!-- Lemon Squeezy Checkout Overlay -->
  <script src="https://app.lemonsqueezy.com/js/lemon.js" defer></script>
</body>

</html>
